<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ground Impact FX Lab</title><style>
:root{color-scheme:dark;font:14px/1.45 system-ui,sans-serif;background:#141820;color:#e7eaf0}*{box-sizing:border-box}body{margin:0}header{padding:12px 18px;border-bottom:1px solid #414957}h1{font-size:20px;margin:0}main{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:calc(100dvh - 75px)}section,aside{padding:16px;min-width:0;overflow:auto}aside{border-left:1px solid #414957}fieldset{border:0;margin:0;padding:0;min-width:0}label{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:6px 0}button,input,select,textarea{font:inherit;background:#242d3a;color:inherit;border:1px solid #526071;border-radius:4px;padding:6px;max-width:100%}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #78dbf2;outline-offset:2px}button:disabled{opacity:.5}input[type=number]{width:125px}input[type=file]{width:190px}textarea{width:100%;height:150px}details{padding:10px 0;border-bottom:1px solid #414957}summary{cursor:pointer;font-weight:600}#viewport{overflow:auto;max-height:calc(100dvh - 230px);min-height:160px}#surface{position:relative;width:512px;height:512px;margin:0 auto;overflow:hidden;isolation:isolate}#surface.checker{background-color:#dce0e5;background-image:conic-gradient(#b1bbc6 25%,transparent 0 50%,#b1bbc6 0 75%,transparent 0);background-size:24px 24px}#surface.dark{background:#10141e}#surface.light{background:#fffaf0}#surface canvas{position:absolute;width:100%;height:100%;inset:0;z-index:-1}#handle{position:absolute;z-index:3;transform:translate(-50%,-50%);width:20px;height:20px;padding:0;border:2px solid #7ceaff;border-radius:50%;background:#1119;touch-action:none;cursor:move}#status[data-error=true]{color:#ffabab}[data-drop-zone]{border:1px dashed #748393;padding:12px;margin:8px 0}#assets li{overflow-wrap:anywhere}#assets li button{margin-left:6px}#assets output{display:block;margin-top:8px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}[hidden]{display:none!important}@media(max-width:800px){main{display:block;height:auto}aside{border-left:0;border-top:1px solid #414957}#viewport{max-height:65dvh}}
</style></head><body><header><h1>Ground Impact FX Lab</h1><small>EARTH-01 · preview candidate · 40 frames / 60 FPS</small></header><main><section><div class="tools"><output id="actual">Not initialized</output><output id="frameLabel">0 / 39</output></div><div id="viewport"><div id="surface" class="checker"><button id="handle" type="button" aria-label="Move selected marker; arrow keys nudge" hidden></button></div></div><p id="status" role="status" aria-live="polite">Initializing...</p><output id="diagnostics"></output></section><aside><label>Backend <select id="backend"><option>webgl2</option><option>webgl1</option><option>webgpu</option></select></label><fieldset id="controls" disabled><details open><summary>Preview and transport</summary><div class="tools"><button id="play">Play</button><button id="reset">Reset time</button><label>Reverse <input id="reverse" type="checkbox"></label></div><label>Frame <input id="frame" type="range" min="0" max="39" value="0"></label><label>Background <select id="background"><option>checker</option><option>dark</option><option>light</option></select></label><div class="tools"><button id="zoomOut">−</button><output id="zoomLabel">100%</output><button id="zoomIn">+</button><button id="fit">Fit</button><button id="actualSize">100%</button></div></details><details open><summary>Spine source</summary><div id="assets"></div><label>Animation <select id="animation"></select></label><label>Skin <select id="skin"></select></label><label>Spine speed <input id="speed" type="number" min="0" max="4" step="any" value="1"></label><label>Show Spine <input id="showSpine" type="checkbox" checked></label></details><details open><summary>Impact and spacing</summary><div id="general"></div></details><details open><summary>Contact and layers</summary><label>Selected marker <select id="marker"><option>contact</option><option>ring</option><option>debris</option><option>dust</option></select></label><div id="layerFields"></div><div id="anchorFields"></div></de
